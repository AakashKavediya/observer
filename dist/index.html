        errBox.innerHTML = '<h2 style="color:#d32f2f;margin-bottom:12px;">JavaScript Error Detected</h2><pre>' + msg + '\nFile: ' + url + ':' + line + ':' + col + '\n\n' + (error && error.stack ? error.stack : '') + '</pre>';
      };
      window.onunhandledrejection = function(e) {
        var errBox = document.getElementById("error-display");
        if (!errBox) {
          errBox = document.createElement("div");

          errBox.style = "position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;color:#b87559;padding:24px;font-family:monospace;font-size:13px;z-index:999999;overflow:auto;";
          document.body.appendChild(errBox);
        }
        var reason = e.reason ? (e.reason.stack || e.reason) : e;
        errBox.innerHTML = '<h2 style="color:#d32f2f;margin-bottom:12px;">Unhandled Promise Rejection</h2><pre>' + reason + '</pre>';
      };
